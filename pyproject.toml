[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epistemic-benchmark"
version = "0.1.0"
description = "Anonymous research artifact for controlled evidence integration and belief revision"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy==1.26.4"]

[project.scripts]
epistemic-benchmark = "epistemic_benchmark.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = false
